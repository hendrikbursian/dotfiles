
[icons]
icons = "awesome6"

[[block]]
block = "keyboard_layout"
driver = "sway"
format = " \uf11c  $layout "

[[block]]
block = "tea_timer"
format = " $icon  {$hours:$minutes:$seconds |} "
done_cmd = "notify-send 'Timer Finished'"
increment = 60

[[block]]
block = "net"
format = " ^icon_net_down$speed_down.eng(prefix:K)  ^icon_net_up$speed_up.eng(prefix:K) "
inactive_format = "  "
interval = 3 

[[block]]
block = "bluetooth"
mac = "E4:0D:36:88:B3:8B"
disconnected_format = ""

[[block]]
block = "cpu"
interval = 12
format = " $icon $utilization ($frequency/$max_frequency) "
format_alt = " $icon $barchart "

[[block]]
block = "memory"
format = " $icon $mem_used.eng(p:Mi)/$mem_total.eng(p:Mi) "
warning_mem = 80
critical_mem = 95

[[block]]
block = "disk_space"
path = "/"
info_type = "used"
format = " $icon $path: $used/$total $percentage "
warning = 40.0
alert = 90.0
interval = 300

[[block]]
block = "disk_space"
path = "/boot"
info_type = "used"
format = " $icon $path: $used/$total $percentage "
warning = 40.0
alert = 90.0
interval = 300

[[block]]
block = "sound"
show_volume_when_muted = true
device_kind = "source"
step_width = 3

[[block]]
block = "sound"
format = " $icon {$volume|} "
show_volume_when_muted = true
headphones_indicator = true
step_width = 3

[[block]]
block = "backlight"

[[block]]
block = "uptime"

[[block]]
block = "battery"
if_command = "test -e /sys/class/power_supply/BAT0"

[[block]]
block = "time"
interval = 10
format = " $timestamp.datetime(f:'%a %d.%m %R Uhr') "

[[block]]
block = "menu"
text = " \uf011 "
[[block.items]]
display =  "  Sleep  "
cmd =  "systemctl suspend"
[[block.items]]
display =  "Power Off"
cmd =  "poweroff"
confirm_msg =  "Are you sure you want to power off?"
[[block.items]]
display =  "  Reboot "
cmd = "reboot"
confirm_msg = "Are you sure you want to reboot?"
